[package]
name = "zeit"
version = "1.2.0"
edition = "2024"
description = "A tool to track your working hours and overtime"

[[bin]]
name = "zeit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.39", features = ["cargo", "color", "derive"] }
anyhow = "1.0.100"
serde = { version = "1.0.219", features = ["derive", "alloc"] }
serde_json = "1.0.141"
chrono = { version = "0.4", features = ["serde"] }