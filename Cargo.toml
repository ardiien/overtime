[package]
name = "zeit"
version = "1.3.0"
edition = "2024"
description = "A tool to track your working hours and overtime"

[[bin]]
name = "zeit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["cargo", "color", "derive"] }
clap_complete = "4.6.11"
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive", "alloc"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }